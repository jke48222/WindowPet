# Builds WindowPet and runs the unit tests on every push and pull request to main.
#
# Runner: macos-26 (Apple silicon) is the newest generally available macOS image. We stay on the
# newest *stable* Xcode that setup-xcode finds. The package targets macOS 14; the on-device model
# path is gated behind #available(macOS 26), so the macOS 26 SDK is enough.
#
# Only `swift build` and `swift test` run here. The tests cover WindowPetCore, which is pure logic:
# they open no windows, touch no microphone and make no network calls. The end to end rig
# (--testrig) drives real windows and stays a local, pre-release step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
